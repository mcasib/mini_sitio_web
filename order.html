<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Orden
    </title>
    <link rel="stylesheet" type="text/css" href="public/css/style.css">
</head>
<body id="order-page">
    <header id="main-header">
        <h1 class="site-title">
            Pedidos
        </h1>

        <nav class="main-nav">
            <ul class="nav-list">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Menú</a></li>
                <li class="nav-item"><a class="nav-link" href="pizza-detail.html">Pizza especial</a></li>
                <li class="nav-item"><a class="nav-link" href="order.html">Pedidos</a></li>
                <li class="nav-item"><a class="nav-link" href="promotions.html">Promociones</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contacto</a></li>
                <li class="nav-item"><a class="nav-link" href="location.html">Ubicación</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section class="content-section">
            <hr>
            <h2 class="section-title">
                Haz tu pedido
            </h2>

            <form order-form>
                <p>
                    <label class="form-label" for="nombre">
                        Nombre:
                    </label>
                    <input class="form-input" type="text" name="nombre" minlength="3" maxlength="15" required>
                </p>

                <p>
                    <label class="form-label" for="telefono">
                        Teléfono:
                    </label>
                    <input class="form-input" type="text" name="telefono" pattern="[0-9]+" minlength="10" maxlength="10" required>   
                </p>

                <section class="sub-section">
                    <p>
                        <label class="form-label" for="pizza">
                            Elige tu pizza:
                        </label>
                        <select class="form-select" id="pizza" name="pizza">
                            <option class="form-option" value="pepperoni">Pepperoni</option>
                            <option class="form-option" value="mexicana">Mexicana</option>
                            <option class="form-option" value="vegetariana">Vegetariana</option>
                            <option class="form-option" value="especial">Especial</option>
                        </select>
                    </p>
                </section>

                <p>
                    <span class="radio-legend">
                        Tamaño de la pizza:
                    </span>
                        
                    <input type="radio" name="tamanio" value="Grande">
                    <label>
                        Grande
                    </label>
                        
                    <input type="radio" name="tamanio" value="Mediana">
                    <label>
                        Mediana
                    </label>
                        
                    <input type="radio" name="tamanio" value="Pequeña">
                    <label>
                        Pequeña
                    </label>
                </p>
                
                <p>
                    <span class="checkbox-legend">
                        Ingredientes adicionales:
                    </span>
                        
                    <input type="checkbox" name="adicional" value="Queso">
                    <label>
                        Queso
                    </label>
                        
                    <input type="checkbox" name="adicional" value="Peperoni">
                    <label>
                        Peperoni
                    </label>
                        
                    <input type="checkbox" name="adicional" value="Champiñones">
                    <label>
                        Champiñones
                    </label>
                </p>

                <p>
                    <label class="form-label" for="cantidad">
                        Cantidad:
                    </label>
                    <input class="form-input" type="number" name="cantidad" min="1" required>
                </p>

                <p>
                    <label class="form-label" for="direccion">
                        Dirección:
                    </label>
                    <input class="form-input" type="text" name="direccion" required>
                </p>

                <p>
                    <label class="form-label" for="comentarios">
                        Comentarios:
                    </label>
                </p>    

                <p>
                    <textarea class="form-textarea" name="comentarios" rows="5" cols="40"></textarea>
                </p>

                <p>
                    <input class="btn-submit" type="submit" value="Enviar pedido">
                    <input class="btn-reset" type="reset" value="Limpiar">
                </p>

            </form>
        </section>
        <hr>
    </main>

    <footer id="site-footer">
        <p>&copy; 2026 Pizzería robloxiana</p>
    </footer>
</body>
</html>
