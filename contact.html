    <header id="main-header">
        <h1 class="site-title">
            Contactanos
        </h1>

        <nav class="main-nav">
            <ul class="nav-list">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">Nosotros</a></li>

            </ul>
        </nav>
    </header>
    
    <main id="main-content">
        <section class="content-section">
            <hr>
            <p>
                Teléfono: <strong>534-536-2789</strong>
            </p>
        </section>

        <section class="content-section">
            <h2 class="section-title">
                Envíanos un mensaje
            </h2>

            <form class="contact-form">
                <p>
                    <label class="form-label" for="nombre">
                        Ingrese su nombre:
                    </label>
                    <input class="form-input" type="text" name="nombre" minlength="3" maxlength="15" required>
                </p>    
                <p>
                    <label class="form-label" for="correo">
                        Correo electrónico:
                    </label>
                    <input class="form-input" type="correo" name="correo" required>
                </p>
                <p>
                    <label class="form-label" for="mensaje">
                        Mensaje:
                    </label><br>
                    <textarea class="form-textarea" name="mensaje" rows="4" cols="38"></textarea>
                </p>
                <p>
                    <button class="btn-submit" type="submit">
                        Enviar
                    </button>
                </p>
            </form>
        </section>
        <hr>
    </main>

    <footer id="site-footer">
        <p>&copy; 2026 Pizzería robloxiana</p>
    </footer>
